<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Feedback Survey</title>
<body>

  <h1 id="title">Student Feedback Survey</h1>
  <p id="description">
    Please fill out this survey to help us improve our learning experience.
  </p>
  <form id="survey-form">
  
    <label id="name-label" for="name">Name</label>
    <input
      type="text"
      id="name"
      name="name"
      placeholder="Enter your full name"
      required
    />

    
    <label id="email-label" for="email">Email</label>
    <input
      type="email"
      id="email"
      name="email"
      placeholder="Enter your email address"
      required
    />

    <label id="number-label" for="number">Age</label>
    <input
      type="number"
      id="number"
      name="age"
      min="10"
      max="100"
      placeholder="Enter your age"
    />

    <label for="dropdown">Current role</label>
    <select id="dropdown" name="role">
      <option value="">Select an option</option>
      <option value="student">Student</option>
      <option value="teacher">Teacher</option>
    </select>

    
    <fieldset>
      <legend>Would you recommend this program?</legend>

      <label>
        <input type="radio" name="recommend" value="yes">
        Yes
      </label>

      <label>
        <input type="radio" name="recommend" value="no">
        No
      </label>
    </fieldset>

    <fieldset>
      <legend>What do you like most? (Select all that apply)</legend>

      <label>
        <input type="checkbox" value="content">
        Course Content
      </label>

      <label>
        <input type="checkbox" value="instructors">
        Instructors
      </label>

      <label>
        <input type="checkbox" value="projects">
        Projects
      </label>
    </fieldset>

    
    <label for="comments">Additional Comments</label>
    <textarea
      id="comments"
      name="comments"
      rows="4"
      placeholder="Share your thoughts here..."
    ></textarea>

    <button id="submit" type="submit">Submit</button>

  </form>

</body>
</html>
